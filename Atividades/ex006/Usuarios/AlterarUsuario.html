<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar Usuário</title>
    <script>
        function BuscarUsuario() {
            let matricula = document.getElementById("matricula").value;

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Resposta chegou ok: " + this.responseText);
                    let dados = JSON.parse(this.responseText);
                    if (dados.encontrado) {
                        document.getElementById("nome").value = dados.nome;
                        document.getElementById("email").value = dados.email;
                        document.getElementById("resultado").innerHTML = "Resultado:";
                    } else {
                        document.getElementById("resultado").innerHTML =
                            "Resultado: Usuário não encontrado.";
                    }
                } else if (this.readyState < 4) {
                    console.log("Carregando: " + this.readyState);
                } else {
                    console.log("Requisição falhou: " + this.status);
                }
            };

            xmlhttp.open(
                "GET",
                "AlterarUsuario.php?matricula=" + encodeURIComponent(matricula),
                true
            );
            xmlhttp.send();
        }

        function AlterarUsuario() {
            let matricula = document.getElementById("matricula").value;
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;

            document.getElementById("resultado").innerHTML = "Alterando...";

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Resposta chegou ok: " + this.responseText);
                    document.getElementById("resultado").innerHTML =
                        "Resultado: " + this.responseText;
                } else if (this.readyState < 4) {
                    console.log("Carregando: " + this.readyState);
                } else {
                    console.log("Requisição falhou: " + this.status);
                }
            };

            xmlhttp.open("POST", "AlterarUsuario.php", true);
            xmlhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xmlhttp.send(
                "matricula=" + encodeURIComponent(matricula) +
                "&nome=" + encodeURIComponent(nome) +
                "&email=" + encodeURIComponent(email)
            );
            console.log("Enviei alteração");
        }

        function CarregarDaUrl() {
            let params = new URLSearchParams(window.location.search);
            if (params.has("matricula")) {
                document.getElementById("matricula").value = params.get("matricula");
                BuscarUsuario();
            }
        }
    </script>
</head>

<body onload="CarregarDaUrl()">
    <form action="" method="post" name="formAlterar" id="formAlterar">
        <input type="text" name="matricula" id="matricula" placeholder="Matrícula:">
        <input type="button" value="Buscar" onclick="BuscarUsuario()"><br><br>
        <input type="text" name="nome" id="nome" placeholder="Alterar nome:"><br>
        <input type="text" name="email" id="email" placeholder="Alterar email:"><br>
        <input type="button" value="Alterar" onclick="AlterarUsuario()">
    </form>
    <h3 id="resultado">Resultado:</h3>
    <a href="ListarUsuarios.html">Voltar para Lista</a>
</body>

</html>
