<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script>
        function Calcula() {
            let num1 = document.getElementById("num1").value;
            let num2 = document.getElementById("num2").value;
            let operador = document.getElementById("operador").value;
            let msg = "Calculando: " + num1 + " " + operador + " " + num2;
            document.getElementById("resultado").innerHTML = msg;
            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function() {
                if(this.readyState == 4 && this.status == 200) {
                    console.log("Resposta chegou ok: " + this.responseText);
                    document.getElementById("resultado").innerHTML =
                        "Resultado: " + this.responseText;
                } else if(this.readyState < 4) {
                    console.log("Carregando: " + this.readyState);
                } else {
                    console.log("Requisição falhou: " + this.status);
                }
            };
            xmlhttp.open(
                "GET",
                "http://localhost/3DAW/Jorge Alves/calculadora.php?num1=" 
                + num1
                + "&num2=" + num2
                + "&operador=" + operador
            );
            xmlhttp.send();
            console.log("Enviei formulário");
        }
    </script>
</head>
<body>
    <form action="" method="get" name="formCalculadora" id="formCalculadora">
        <input type="text" name="num1" id="num1" placeholder="Operando 1:"><br>
        <input type="text" name="num2" id="num2" placeholder="Operando 2:"><br>
        <input type="text" name="operador" id="operador" placeholder="Operador:"><br>
        <input type="button" value="Enviar" onclick="Calcula()">
    </form>
    <h3 id="resultado">Resultado:</h3>
</body>
</html>
