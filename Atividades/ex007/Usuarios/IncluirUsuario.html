<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusão de Usuário</title>
    <script>
        function IncluirUsuario() {
            let nome = document.getElementById("nome").value;
            let email = document.getElementById("email").value;
            let matricula = document.getElementById("matricula").value;

            document.getElementById("resultado").innerHTML = "Enviando...";

            let xmlhttp = new XMLHttpRequest();
            xmlhttp.onreadystatechange = function () {
                if (this.readyState == 4 && this.status == 200) {
                    console.log("Resposta chegou ok: " + this.responseText);
                    document.getElementById("resultado").innerHTML =
                        "Resultado: " + this.responseText;
                    document.getElementById("formUsuario").reset();
                } else if (this.readyState < 4) {
                    console.log("Carregando: " + this.readyState);
                } else {
                    console.log("Requisição falhou: " + this.status);
                }
            };

            xmlhttp.open("POST", "IncluirUsuario.php", true);
            xmlhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
            xmlhttp.send(
                "matricula=" + encodeURIComponent(matricula) +
                "&nome=" + encodeURIComponent(nome) +
                "&email=" + encodeURIComponent(email)
            );
            console.log("Enviei formulário");
        }
    </script>
</head>

<body>
    <form action="" method="post" name="formUsuario" id="formUsuario">
        <input type="text" name="nome" id="nome" placeholder="Nome:"><br>
        <input type="text" name="email" id="email" placeholder="Email:"><br>
        <input type="text" name="matricula" id="matricula" placeholder="Matrícula:"><br>
        <input type="button" value="Enviar" onclick="IncluirUsuario()">
    </form>
    <h3 id="resultado">Resultado:</h3>
    <a href="ListarUsuarios.html">Voltar para Lista</a>
</body>

</html>
